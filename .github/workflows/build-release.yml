      - name: Build Debug APK
        run: |
          GRADLEW_PATH=$(find . -maxdepth 3 -name "gradlew" | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW_PATH")
            cd "$PROJECT_DIR"
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            BUILD_GRADLE=$(find . -maxdepth 3 -name "build.gradle*" | head -n 1)
            PROJECT_DIR=$(dirname "$BUILD_GRADLE")
            cd "$PROJECT_DIR"
            gradle wrapper --gradle-version 8.7
            ./gradlew assembleDebug
          fi
          APK_FILE=$(find . -name "*.apk" | head -n 1)
          echo "APK_PATH=$PROJECT_DIR/${APK_FILE#./}" >> $GITHUB_ENV
