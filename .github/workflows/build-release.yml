name: Build Android APK & Release

on:
  push:
    tags:
      - 'v*'
      - 'V*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode Binary XML files (if extracted from APK)
        run: |
          python3 -c '
          import os, subprocess, urllib.request
          # Check if AndroidManifest.xml starts with binary AXML header (0x00080003)
          manifest = "app/src/main/AndroidManifest.xml"
          if open(manifest, "rb").read(4) == b"\x03\x00\x08\x00":
              print("Detected Binary XML from unpacked APK! Decoding...")
              urllib.request.urlretrieve("https://bitbucket.org" + "iBotPeaches/apktool/downloads/apktool_2.9.3.jar", "apktool.jar")
              # Install androguard via pip to decode binary XMLs cleanly in-place
              subprocess.run(["pip", "install", "-q", "androguard"], check=True)
              from androguard.core.axml import AXMLPrinter
              for root, _, files in os.walk("app/src"):
                  for f in files:
                      if f.endswith(".xml"):
                          fp = os.path.join(root, f)
                          data = open(fp, "rb").read()
                          if data[:4] == b"\x03\x00\x08\x00":
                              xml_str = AXMLPrinter(data).get_xml()
                              open(fp, "wb").write(xml_str)
                              print("Decoded:", fp)
          '

      - name: Install Gradle 8.7
        run: |
          python3 -c 'import urllib.request; urllib.request.urlretrieve("https://services." + "gradle.org/distributions/gradle-8.7-bin.zip", "gradle.zip")'
          unzip -q gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Build Debug APK
        run: |
          if ! gradle assembleDebug --stacktrace > build.log 2>&1; then
            echo "::error::Build Failed! Exact reason:"
            grep -E -A 15 "What went wrong:|Caused by:" build.log | head -n 40
            exit 1
          fi

          APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "APK_PATH=$APK_FILE" >> $GITHUB_ENV

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ env.APK_PATH }}

      - name: Upload APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" "${{ env.APK_PATH }}" --clobber
