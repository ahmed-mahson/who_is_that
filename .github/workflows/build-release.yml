name: Build Android APK & Release

on:
  push:
    tags:
      - 'v*'
      - 'V*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Debug APK
        run: |
          GRADLEW_PATH=$(find . -maxdepth 3 -name "gradlew" | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW_PATH")
            cd "$PROJECT_DIR"
            chmod +x gradlew
            BUILD_CMD="./gradlew assembleDebug"
          else
            BUILD_GRADLE=$(find . -maxdepth 3 -name "build.gradle*" | head -n 1)
            PROJECT_DIR=$(dirname "$BUILD_GRADLE")
            cd "$PROJECT_DIR"
            gradle wrapper --gradle-version 8.7
            BUILD_CMD="./gradlew assembleDebug"
          fi

          if ! $BUILD_CMD > build.log 2>&1; then
            echo "::error::Build Failed! Here is the exact reason:"
            grep -E -A 10 "What went wrong:|Caused by:|Execution failed" build.log | head -n 30
            exit 1
          fi

          APK_FILE=$(find . -name "*.apk" | head -n 1)
          echo "APK_PATH=$PROJECT_DIR/${APK_FILE#./}" >> $GITHUB_ENV

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ env.APK_PATH }}

      - name: Upload APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" "${{ env.APK_PATH }}" --clobber
