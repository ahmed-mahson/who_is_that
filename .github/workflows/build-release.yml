name: Build Android APK & Release

on:
  push:
    tags:
      - 'v*'
      - 'V*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle 8.7
        run: |
          curl -fsSL -o gradle.zip "https://gradle.org"
          unzip -q gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Build Debug APK
        run: |
          BUILD_GRADLE=$(find . -maxdepth 3 -name "build.gradle*" | head -n 1)
          PROJECT_DIR=$(dirname "$BUILD_GRADLE")
          echo "Building project in: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          if ! gradle assembleDebug > build.log 2>&1; then
            echo "::error::Build Failed! Exact reason:"
            grep -E -A 10 "What went wrong:|Caused by:|Execution failed" build.log | head -n 30
            exit 1
          fi

          APK_FILE=$(find . -name "*.apk" | head -n 1)
          echo "APK_PATH=$PROJECT_DIR/${APK_FILE#./}" >> $GITHUB_ENV

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ env.APK_PATH }}

      - name: Upload APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" "${{ env.APK_PATH }}" --clobber
